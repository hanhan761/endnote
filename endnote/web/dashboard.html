<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>全部任务 · endnote</title><link rel="stylesheet" href="../dashboard.css"><script src="../dashboard.js" defer></script></head><body><main><nav><a class="brand" href="../">endnote<span>实验提醒</span></a><span class="privacy">邮箱私有 · 只读看板</span></nav><header><div><p class="eyebrow">YOUR EXPERIMENTS, AT A GLANCE</p><h1>每个实验，<span>都有动静。</span></h1><p class="intro">任务状态、心跳和指标，集中看这里。</p></div><button id="refresh">刷新状态 ↻</button></header><div id="notice" role="status" aria-live="polite">正在读取任务…</div><section class="summary" id="summary" aria-label="任务状态汇总"></section><section class="controls"><label>查找实验<input id="search" type="search" placeholder="当前页的实验名称或任务编号"></label><label>任务状态<select id="filter"><option value="all">全部任务</option><option value="running">运行中</option><option value="outage">心跳失联</option><option value="succeeded">已成功</option><option value="failed">已失败</option><option value="cancelled">已取消</option></select></label><p id="updated"></p></section><section id="tasks" class="task-grid" aria-label="实验任务"></section><div class="pagination"><button id="previous">← 上一页</button><span id="page"></span><button id="next">下一页 →</button></div><footer><span>每 15 秒自动刷新 · 每页 200 个任务 · 优先显示运行中的任务</span><p>链接可查看这个邮箱的全部任务，请勿转发。心跳表示上报进程活着；指标需要实验主动上报。已结束任务保留 30 天。</p></footer></main></body></html>
