<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>状态总览 · endnote</title><link rel="stylesheet" href="../dashboard.css"><script src="../dashboard.js" defer></script></head><body><main><nav><div class="nav-title"><a class="brand" href="../"><span class="mark">en.</span>endnote</a><span class="divider"></span><h1>实验状态</h1></div><div class="live-status" id="connection" role="status"><span class="live-dot"></span><span id="live-text">正在连接</span><span class="refresh-note">自动更新 · 5s</span></div></nav><section class="overview"><div class="section-label">STATUS OVERVIEW <span>未归档任务</span></div><div id="summary" class="summary" aria-label="全部未归档任务的统计"></div></section><section class="workspace"><div class="toolbar"><div id="tabs" class="tabs" aria-label="筛选任务"></div><label class="search"><span aria-hidden="true">⌕</span><input id="search" type="search" placeholder="搜索实验名称 / 编号" aria-label="搜索所有任务"></label></div><div id="notice" class="notice" role="status" aria-live="polite"></div><div class="table-wrap"><table><caption class="sr-only">实验任务状态总览</caption><colgroup><col class="name-width"><col class="state-width"><col class="heartbeat-width"><col class="duration-width"><col class="metrics-width"><col class="mail-width"><col class="action-width"></colgroup><thead><tr><th>实验 / 编号</th><th>状态</th><th>最后心跳</th><th class="duration-col">运行时长</th><th class="metrics-col">关键指标</th><th class="mail-col">最近通知</th><th class="action-heading">整理</th></tr></thead><tbody id="tasks"></tbody></table><div id="empty" class="empty" hidden></div></div><div class="table-footer"><span id="result-count"></span><div class="pagination"><button id="previous" aria-label="上一页">←</button><span id="page"></span><button id="next" aria-label="下一页">→</button></div></div></section><footer><span>私有状态看板 · 请勿转发邮件中的链接</span><span id="updated">尚未更新</span></footer><p class="footnote">归档只整理此邮箱的视图，数据仍保留，随时可从“已归档”恢复。心跳与指标以上报为准；已结束任务保留 30 天。</p></main><dialog id="detail"><div class="detail-head"><div><span class="section-label">EXPERIMENT DETAIL</span><h2 id="detail-name"></h2></div><button id="close-detail" aria-label="关闭详情">×</button></div><div id="detail-content"></div></dialog></body></html>
